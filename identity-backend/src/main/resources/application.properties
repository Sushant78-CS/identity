
# ==========================================
# APPLICATION
# ==========================================
spring.application.name=${APP_NAME:identity-backend}

# ==========================================
# DATABASE - NEON POSTGRESQL
# ==========================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# ==========================================
# FLYWAY
# ==========================================
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}

# ==========================================
# SERVER
# ==========================================
server.port=${PORT:8080}
server.address=${SERVER_ADDRESS:0.0.0.0}

# ==========================================
# JWT SECURITY
# ==========================================
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.issuer=${JWT_ISSUER:identity-backend}
app.security.jwt.expiration=${JWT_EXPIRATION:900}

# ==========================================
# REFRESH TOKEN
# ==========================================
app.security.refresh-token.expiration-seconds=${REFRESH_TOKEN_EXPIRATION:604800}

# ==========================================
# DYNAMIC STUDENT QR
# ==========================================
app.security.qr.expiration-seconds=${QR_EXPIRATION:60}

# ==========================================
# MULTIPART CONFIGURATION
# ==========================================
spring.servlet.multipart.enabled=${MULTIPART_ENABLED:true}
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:12MB}

# ==========================================
# EMAIL CONFIGURATION
# ==========================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}

spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT:10000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT:10000}

# ==========================================
# FRONTEND ACTIVATION
# ==========================================
app.frontend.activation-url=${FRONTEND_ACTIVATION_URL:http://localhost:5173/activate}

# ==========================================
# SUPER ADMIN
# ==========================================
app.bootstrap.super-admin.email=${SUPER_ADMIN_EMAIL}
app.bootstrap.super-admin.password=${SUPER_ADMIN_PASSWORD}
app.bootstrap.super-admin.full-name=${SUPER_ADMIN_NAME}

# ==========================================
# HIKARICP CONNECTION POOL
# ==========================================
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:1}

# ==========================================
# CONNECTION LIFECYCLE
# ==========================================
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:300000}
spring.datasource.hikari.keepalive-time=${DB_KEEPALIVE_TIME:120000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:180000}

# ==========================================
# CONNECTION TIMEOUT
# ==========================================
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.validation-timeout=${DB_VALIDATION_TIMEOUT:5000}

# ==========================================
# WEBSITE COOKIE AUTHENTICATION
# ==========================================
app.security.cookie.secure=${COOKIE_SECURE:false}
app.security.cookie.same-site=${COOKIE_SAME_SITE:Lax}

# ==========================================
# FRONTEND CORS
# ==========================================
app.security.web.allowed-origin=${FRONTEND_ALLOWED_ORIGIN:http://localhost:5173}
